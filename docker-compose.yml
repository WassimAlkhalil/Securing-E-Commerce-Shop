services:

  db:
     image: mysql:8.0
     command:
      - --default_authentication_plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
     volumes:
       - db_data:/var/lib/mysql
     restart: unless-stopped
     environment:
       MYSQL_ROOT_PASSWORD: root
       MYSQL_DATABASE: flaskshop

  redis:
    image: library/redis:5.0-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  elasticsearch:
    image: elasticsearch:8.11.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  web:
    volumes:
      - .:/app
    build: .
    depends_on:
      - db
      - redis
      - elasticsearch
    # Expose in docker network instead of opening ports to the host
    # @author: Nebil Müren - cas3322
    expose:
      - "5000"
    environment:
      DB_URI: mysql+pymysql://root:root@db:3306/flaskshop?charset=utf8mb4
      REDIS_URI: redis://redis:6379
      ESEARCH_URI: http://elasticsearch:9200
      FLASK_DEBUG: 1
    restart: unless-stopped

  # Added Caddy server to handle HTTPS reverse proxy
  # @author: Nebil Müren - cas3322
  caddy:
    image: caddy:alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

volumes:
  db_data:
  redis-data:
  elasticsearch-data:
